plugins {
    id 'com.android.application'
}

android {
    namespace 'com.warplite.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.warplite.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            // CI / build.sh pass the key through the environment; without it the debug key is used.
            def ks = System.getenv('EX_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('EX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('EX_KEY_ALIAS')
                keyPassword System.getenv('EX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('EX_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
